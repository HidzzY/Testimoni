<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster Pedia | Testi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white">

    <section class="container mx-auto px-6 py-16 text-center">
        <h1 class="text-6xl font-black mb-4 tracking-tighter" data-aos="fade-down">
            BOOSTER <span class="text-blue-600">PEDIA.</span>
        </h1>
        <p class="text-gray-400 max-w-lg mx-auto mb-10" data-aos="fade-up">Solusi suntik followers, likes, dan views termurah dengan proses kilat.</p>

        <div class="relative inline-block group" data-aos="zoom-in">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
            <img src="https://files.catbox.moe/2zp6mn.png" class="relative rounded-2xl border border-white/10 max-w-full h-auto md:max-w-2xl shadow-2xl">
        </div>

        <div class="mt-12 flex flex-wrap justify-center gap-6" data-aos="fade-up">
            <a href="https://instagram.com/w.hidzy" class="btn-primary">Instagram: w.hidzy</a>
            <a href="https://tiktok.com/@w.hizz" class="btn-secondary">TikTok: w.hizz</a>
        </div>
    </section>

    <section class="container mx-auto px-6 pb-32">
        <div class="flex items-center gap-4 mb-12">
            <div class="h-[1px] flex-grow bg-white/10"></div>
            <h2 class="text-2xl font-bold uppercase tracking-widest text-blue-500">Testimonials</h2>
            <div class="h-[1px] flex-grow bg-white/10"></div>
        </div>

        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="testi-card" data-aos="fade-up">
                <img src="https://files.catbox.moe/7i7dok.png" class="w-full rounded-xl">
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
