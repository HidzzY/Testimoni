<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster Pedia | Testi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .logo-glow {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }
    </style>
</head>
<body class="bg-[#050505] text-white">

    <section class="container mx-auto px-6 py-20 text-center">
        <div class="flex justify-center mb-10" data-aos="zoom-in">
            <div class="relative group">
                <div class="absolute -inset-1 bg-blue-600 rounded-xl blur opacity-20 group-hover:opacity-40 transition duration-1000"></div>
                <img src="https://files.catbox.moe/q42j69.png" 
                     alt="BoosterPedia Logo" 
                     class="relative w-full max-w-[300px] md:max-w-[450px] rounded-xl object-contain border border-white/10 logo-glow">
            </div>
        </div>

        <h1 class="text-6xl md:text-7xl font-black mb-4 tracking-tighter" data-aos="fade-down">
            BOOSTER <span class="text-blue-600">PEDIA.</span>
        </h1>
        <p class="text-gray-400 max-w-lg mx-auto mb-10 text-sm md:text-base" data-aos="fade-up">
            Solusi suntik followers, likes, dan views termurah dengan proses kilat dan terpercaya.
        </p>

        <div class="flex flex-wrap justify-center gap-4 md:gap-6" data-aos="fade-up" data-aos-delay="200">
            <a href="https://www.instagram.com/boosterpedia_" target="_blank" class="px-8 py-4 bg-blue-600 rounded-2xl font-bold hover:bg-blue-500 transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] text-sm">
                IG: @boosterpedia_
            </a>
            <a href="https://instagram.com/w.hidzy" target="_blank" class="px-8 py-4 bg-white/5 border border-white/10 rounded-2xl font-bold hover:bg-white/10 transition-all text-sm">
                Instagram HidzY
            </a>
            <a href="https://tiktok.com/@w.hizz" target="_blank" class="px-8 py-4 bg-white/5 border border-white/10 rounded-2xl font-bold hover:bg-white/10 transition-all text-sm">
                TikTok HidzY
            </a>
        </div>
    </section>

    <section class="container mx-auto px-6 pb-32">
        <div class="flex items-center gap-4 mb-16" data-aos="fade-right">
            <div class="h-[1px] w-12 bg-blue-600"></div>
            <h2 class="text-xl md:text-2xl font-bold uppercase tracking-[0.3em] text-white">Testimoni</h2>
            <div class="h-[1px] flex-grow bg-white/5"></div>
        </div>

        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                <div class="loader mb-4"></div>
                <p class="text-xs font-mono tracking-widest animate-pulse">Sabar Cek..</p>
            </div>
        </div>
    </section>

    <footer class="py-10 border-t border-white/5 text-center">
        <p class="text-[10px] text-gray-600 tracking-widest uppercase">© 2026 BoosterPedia - Testi</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
